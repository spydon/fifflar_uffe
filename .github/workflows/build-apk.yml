name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Read version
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "fifflar-uffe-v${{ steps.version.outputs.version }}-${{ github.run_number }}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: >-
            Fifflar-Uffe v${{ steps.version.outputs.version }}
            (build ${{ github.run_number }})
          files: fifflar-uffe-v${{ steps.version.outputs.version }}-${{ github.run_number }}.apk
          make_latest: true
