name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'LICENSE'
      - 'supabase/**'

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Bump version
        id: version
        run: |
          dart run melos version \
            --all \
            --yes \
            --no-changelog \
            --no-git-tag-version \
            --no-git-commit-version \
            --manual-version=fifflar_uffe:patch
          version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Release v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up release signing
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          PROPS

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "fifflar-uffe-v${{ steps.version.outputs.version }}.apk"

      - name: Build app bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Push version bump
        run: git push origin HEAD:main

      - name: Upload to Play Console
        if: env.PLAY_JSON != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.spydon.fifflar_uffe
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: production
          status: draft

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.sha }}
          name: Fifflar-Uffe v${{ steps.version.outputs.version }}
          files: fifflar-uffe-v${{ steps.version.outputs.version }}.apk
          make_latest: true
